
name: CI/CD Deploy Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test Website
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Verify required website files exist
        run: |
          for file in index.html style.css script.js; do
            if [ ! -f "$file" ]; then
              echo "Error: $file is missing!"
              exit 1
            fi
          done
          echo "All required files exist."

      - name: Verify index.html content
        run: |
          grep -q "DevOps Training" index.html

      - name: Build website
        run: |
          mkdir -p dist
          cp index.html style.css script.js dist/

      - name: Deploy to Amazon S3
        run: |
          aws s3 sync dist/ s3://devops-cicd-ash/ --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"
